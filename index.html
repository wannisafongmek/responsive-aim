<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse by Job Categories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #FAFAFA;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 1420px;
      margin: 0 auto;
    }

    .section-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .section-title {
      font-size: 32px;
      font-weight: 700;
      color: #111827;
      line-height: 1.2;
    }

    /* Grid Layout สำหรับ Desktop: 4 คอลัมน์ */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
    }

    /* Category Card ทั่วไป */
    .category-card {
      background-color: #FFFFFF;
      border-radius: 12px;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.04);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .category-card:hover {
      transform: translateY(-4px);
      box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.08);
    }

    .icon-wrapper {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background-color: #FFF4EC;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      font-size: 24px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      color: #111827;
      margin-bottom: 8px;
    }

    .card-subtitle {
      font-size: 14px;
      color: #6B7280;
    }

    /* Action Card สีส้มแบบพิเศษ */
    .category-card.featured {
      background-color: #FF6B4A;
      color: #FFFFFF;
      justify-content: center;
    }

    .category-card.featured .card-title {
      color: #FFFFFF;
      font-size: 22px;
      margin-bottom: 16px;
    }

    .category-card.featured .card-subtitle {
      color: rgba(255, 255, 255, 0.9);
      font-size: 15px;
    }

    /* ========================================================
       Responsive Layout: Mobile Screen (Width <= 768px)
       ======================================================== */
    @media (max-width: 768px) {
      body {
        padding: 24px 16px;
      }

      .section-title {
        font-size: 24px;
        margin-bottom: 24px;
      }

      /* เปลี่ยนการจัดวางเป็น 1 คอลัมน์เรียงต่อกันยาวลงมา */
      .category-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .category-card {
        padding: 24px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Section Header -->
    <header class="section-header">
      <h2 class="section-title">Browse by<br>Job Categories</h2>
    </header>

    <!-- Categories Grid Container -->
    <main class="category-grid">

      <!-- Item 1 -->
      <div class="category-card">
        <div class="icon-wrapper">📢</div>
        <h3 class="card-title">Digital Marketing</h3>
        <p class="card-subtitle">140 Jobs Opened</p>
      </div>

      <!-- Item 2 -->
      <div class="category-card">
        <div class="icon-wrapper">✏️</div>
        <h3 class="card-title">Art & Design</h3>
        <p class="card-subtitle">85 Jobs Opened</p>
      </div>

      <!-- Item 3 -->
      <div class="category-card">
        <div class="icon-wrapper">💲</div>
        <h3 class="card-title">Accounting</h3>
        <p class="card-subtitle">92 Jobs Opened</p>
      </div>

      <!-- Item 4 -->
      <div class="category-card">
        <div class="icon-wrapper">📷</div>
        <h3 class="card-title">Photography</h3>
        <p class="card-subtitle">45 Jobs Opened</p>
      </div>

      <!-- Item 5 -->
      <div class="category-card">
        <div class="icon-wrapper">📝</div>
        <h3 class="card-title">Copy Writing</h3>
        <p class="card-subtitle">112 Jobs Opened</p>
      </div>

      <!-- Item 6 -->
      <div class="category-card">
        <div class="icon-wrapper">🎧</div>
        <h3 class="card-title">Music</h3>
        <p class="card-subtitle">38 Jobs Opened</p>
      </div>

      <!-- Item 7 -->
      <div class="category-card">
        <div class="icon-wrapper">🤝</div>
        <h3 class="card-title">Human Resources</h3>
        <p class="card-subtitle">64 Jobs Opened</p>
      </div>

      <!-- Item 8 (Featured Orange Card) -->
      <div class="category-card featured">
        <h3 class="card-title">Explore<br>30 More<br>Categories</h3>
      </div>

    </main>

  </div>

</body>
</html>
